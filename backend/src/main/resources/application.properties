spring.application.name=outuolu-backend
server.port=8080

# Supabase JWT Configuration
# Replace with your project URL
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://your-project-id.supabase.co/auth/v1

# Database Configuration (Local Supabase)
spring.datasource.url=jdbc:postgresql://localhost:54322/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
