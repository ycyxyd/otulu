version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: outuolu-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - outuolu-net
    restart: always

  backend:
    build: ../backend
    container_name: outuolu-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - REDIS_HOST=redis
      # Add Supabase keys here in production
    depends_on:
      - redis
    networks:
      - outuolu-net
    restart: always

  n8n:
    image: n8nio/n8n
    container_name: outuolu-n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=password # Change this in production!
      - WEBHOOK_URL=https://n8n.your-domain.com/
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/home/node/workflows # Mount workflows for easy import
    networks:
      - outuolu-net
    restart: always

volumes:
  redis_data:
  n8n_data:


networks:
  outuolu-net:
    driver: bridge
